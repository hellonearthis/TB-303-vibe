<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TB-303 Clone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>TB-303</h1>
            <div class="transport-controls">
                <button id="btn-play" class="btn-primary">PLAY</button>
                <button id="btn-stop" class="btn-secondary">STOP</button>
                <div class="tempo-control">
                    <label for="tempo">BPM</label>
                    <input type="number" id="tempo" value="120" min="60" max="200">
                </div>
            </div>
        </header>

        <section class="synth-controls">
            <div class="knob-group">
                <label>Wave</label>
                <select id="wave-type">
                    <option value="sawtooth">Saw</option>
                    <option value="square">Square</option>
                </select>
            </div>
            <div class="knob-group">
                <label>Cutoff</label>
                <input type="range" id="cutoff" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="knob-group">
                <label>Resonance</label>
                <input type="range" id="resonance" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="knob-group">
                <label>Env Mod</label>
                <input type="range" id="env-mod" min="0" max="1" step="0.01" value="0.7">
            </div>
            <div class="knob-group">
                <label>Decay</label>
                <input type="range" id="decay" min="0" max="1" step="0.01" value="0.4">
            </div>
        </section>

        <section class="sequencer-section">
            <div class="grid-header">
                <h2>Sequencer Grid</h2>
                <button id="btn-clear" class="btn-secondary">Clear</button>
            </div>
            
            <div class="grid-container" id="grid-container">
                <!-- Grid will be generated by JS -->
            </div>
        </section>

        <section class="pattern-memory">
            <div class="memory-header">
                <h2>Pattern Memory (1-9)</h2>
                <div class="mode-toggle">
                    <input type="radio" id="mode-recall" name="memory-mode" value="recall" checked>
                    <label for="mode-recall">Recall</label>
                    
                    <input type="radio" id="mode-save" name="memory-mode" value="save">
                    <label for="mode-save">Save</label>
                </div>
            </div>
            <div class="pattern-slots" id="pattern-slots">
                <!-- Slots 1-9 generated by JS -->
            </div>
        </section>
    </div>

    <script src="audio.js"></script>
    <script src="sequencer.js"></script>
    <script src="app.js"></script>
</body>
</html>
